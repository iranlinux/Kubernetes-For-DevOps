apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: nodejs-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nodejs-dr
spec:
  host: nodejs
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nodejs
spec:
  hosts:
    - "*"
  gateways:
    - nodejs-gateway
  http:
    - route:
        - destination:
            host: nodejs
            port:
              number: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
        version: v1
    spec:
      containers:
        - name: nodejs
          image: iranlinux/istio-demo:v1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs
  namespace: default
spec:
  type: NodePort
  selector:
    app: nodejs
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

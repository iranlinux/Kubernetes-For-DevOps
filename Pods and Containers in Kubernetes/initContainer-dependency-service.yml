apiVersion: v1
kind: Pod
metadata:
  name: mydb-pod
  labels:
    app: mydb
spec:
  containers:
    - name: mydb
      image: busybox:latest
      command:
        - sh
        - -c
        - "echo MyDB running; sleep 3600"
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mydb
spec:
  selector:
    app: mydb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
